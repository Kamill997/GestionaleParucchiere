services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gestionale
      POSTGRES_PASSWORD: gestionale
      POSTGRES_DB: gestionale
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gestionale"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-gestionaleredispass123}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-gestionaleredispass123} ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - postgres

  backend:
    build:
      context: ./backend
      target: development
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://gestionale:gestionale@postgres:5432/gestionale
      REDIS_URL: redis://:${REDIS_PASSWORD:-gestionaleredispass123}@redis:6379/0
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
      DJANGO_CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173"
      DJANGO_CSRF_TRUSTED_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: python manage.py runserver 0.0.0.0:8000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  celery-worker:
    build:
      context: ./backend
      target: development
    restart: unless-stopped
    depends_on:
      - backend
      - redis
    environment:
      DATABASE_URL: postgresql://gestionale:gestionale@postgres:5432/gestionale
      REDIS_URL: redis://:${REDIS_PASSWORD:-gestionaleredispass123}@redis:6379/0
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
    volumes:
      - ./backend:/app
    command: celery -A config worker -l info

  celery-beat:
    build:
      context: ./backend
      target: development
    restart: unless-stopped
    depends_on:
      - backend
      - redis
    environment:
      DATABASE_URL: postgresql://gestionale:gestionale@postgres:5432/gestionale
      REDIS_URL: redis://:${REDIS_PASSWORD:-gestionaleredispass123}@redis:6379/0
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
    volumes:
      - ./backend:/app
      - celerybeat_data:/app/celerybeat
    # --schedule: percorso persistente cosi' il beat non riparte da zero
    # ad ogni restart del container e non invia doppioni nei primi minuti.
    command: celery -A config beat -l info --schedule=/app/celerybeat/celerybeat-schedule

  frontend:
    build:
      context: ./frontend
      target: development
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000/api/v1
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host

volumes:
  postgres_data:
  redis_data:
  celerybeat_data:
