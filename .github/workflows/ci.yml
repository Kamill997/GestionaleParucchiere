name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/test
      REDIS_URL: redis://localhost:6379
      DJANGO_SECRET_KEY: ci-test-secret-key-almeno-32-caratteri-ok
      DJANGO_DEBUG: "True"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      # Fase 6 — Hardening: lint + format in CI bloccano il merge se non puliti
      - run: ruff check .
      - run: ruff format --check .
      # Scansione vulnerabilità dipendenze backend (Fase 6)
      - run: pip-audit --skip-editable
      # Verifica che non ci siano migrazioni non applicate (nascondere
      # migrations mancanti in produzione e' una fonte comune di errori).
      - run: python manage.py migrate
      - run: python manage.py migrate --check
      - run: pytest

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gestionale
          POSTGRES_PASSWORD: gestionale
          POSTGRES_DB: gestionale
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gestionale"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      DATABASE_URL: postgresql://gestionale:gestionale@localhost:5432/gestionale
      REDIS_URL: redis://localhost:6379
      DJANGO_SECRET_KEY: ci-e2e-secret-key-almeno-32-caratteri-ok
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
      DJANGO_CORS_ALLOWED_ORIGINS: "http://localhost:5173"
      VITE_API_URL: "http://localhost:8000/api/v1"
      # Email/password degli utenti di test creati dalla fixture E2E
      E2E_ADMIN_EMAIL: ${{ vars.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      E2E_CLIENTE_EMAIL: ${{ vars.E2E_CLIENTE_EMAIL }}
      E2E_CLIENTE_PASSWORD: ${{ secrets.E2E_CLIENTE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Installa dipendenze backend
        working-directory: ./backend
        run: pip install -r requirements.txt

      - name: Migra DB e crea utenti di test E2E
        working-directory: ./backend
        run: |
          python manage.py migrate
          # Crea superuser admin e utente cliente per i test E2E.
          # Le password arrivano dai secret GitHub; qui usiamo i default
          # sicuri anche se i secret non sono configurati (la CI fallira'
          # comunque sul login, segnalando che i secret mancano).
          python manage.py shell -c "
          from apps.users.models import User
          from apps.roles.models import Role
          from apps.clienti.models import Cliente

          admin_email = '${{ vars.E2E_ADMIN_EMAIL }}' or 'admin@test.local'
          admin_pw = '${{ secrets.E2E_ADMIN_PASSWORD }}' or 'test-password-sicura-123'
          cliente_email = '${{ vars.E2E_CLIENTE_EMAIL }}' or 'cliente@test.local'
          cliente_pw = '${{ secrets.E2E_CLIENTE_PASSWORD }}' or 'test-password-sicura-123'

          admin_role, _ = Role.objects.get_or_create(nome='Amministratore')
          admin, _ = User.objects.get_or_create(email=admin_email)
          admin.set_password(admin_pw); admin.is_staff=True; admin.save()
          admin.roles.set([admin_role])

          cliente_role, _ = Role.objects.get_or_create(nome='Cliente')
          cliente_user, created = User.objects.get_or_create(email=cliente_email)
          cliente_user.set_password(cliente_pw); cliente_user.save()
          cliente_user.roles.set([cliente_role])
          if created:
              Cliente.objects.create(user=cliente_user, nome='Cliente E2E', email=cliente_email)
          "

      - name: Avvia backend Django in background
        working-directory: ./backend
        run: nohup python manage.py runserver 8000 &
        env:
          DATABASE_URL: postgresql://gestionale:gestionale@localhost:5432/gestionale
          REDIS_URL: redis://localhost:6379
          DJANGO_SECRET_KEY: ci-e2e-secret-key-almeno-32-caratteri-ok
          DJANGO_DEBUG: "True"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Installa browser Playwright
        run: npx playwright install chromium --with-deps

      - name: Attendi che il backend risponda
        run: |
          for i in $(seq 1 20); do
            curl -sf http://localhost:8000/health/ && break
            sleep 2
          done

      - name: Esegui test E2E
        run: npm run test:e2e

      - name: Carica report se fallisce
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Scansione vulnerabilità dipendenze frontend (Fase 6)
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run format:check
      - run: npx tsc -b
      - run: npm run test
      # Build completa in CI: garantisce che il bundle di produzione (inclusi
      # il service worker PWA e il manifest) venga generato senza errori ad
      # ogni push, non solo al momento del deploy.
      - run: npm run build
