name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/test
      REDIS_URL: redis://localhost:6379
      DJANGO_SECRET_KEY: ci-test-secret-key-almeno-32-caratteri-ok
      DJANGO_DEBUG: "True"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      # Fase 6 — Hardening: lint + format in CI bloccano il merge se non puliti
      - run: ruff check .
      - run: ruff format --check .
      # Verifica che non ci siano migrazioni non applicate (nascondere
      # migrations mancanti in produzione e' una fonte comune di errori).
      - run: python manage.py migrate
      - run: python manage.py migrate --check
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npx tsc -b
      - run: npm run test
      # Build completa in CI: garantisce che il bundle di produzione (inclusi
      # il service worker PWA e il manifest) venga generato senza errori ad
      # ogni push, non solo al momento del deploy.
      - run: npm run build
